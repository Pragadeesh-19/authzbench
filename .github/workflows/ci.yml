name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install the benchmark with Nodus and the test tools
        run: python -m pip install -e ".[nodus,test]"

      - name: Tests
        run: python -m pytest -v -ra

  go:
    name: go (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.25.x", "stable"]
    defaults:
      run:
        shell: bash
        working-directory: go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go/go.sum

      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Tests
        run: go test -count=1 ./...

  services:
    name: services (SpiceDB and OpenFGA adapters)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Start SpiceDB and OpenFGA on PostgreSQL
        run: docker compose -f services/compose.yaml up --detach --wait spicedb openfga

      - name: Adapter tests against the real servers
        working-directory: go
        env:
          AUTHZBENCH_SPICEDB_ENDPOINT: localhost:50051
          AUTHZBENCH_OPENFGA_URL: http://localhost:8080
        run: go test -count=1 -v ./engines/spicedb/ ./engines/openfga/

      - name: Server logs
        if: failure()
        run: docker compose -f services/compose.yaml logs
